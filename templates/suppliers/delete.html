{% extends "base.html" %}
{% block title %}Delete Supplier{% endblock %}
{% block content %}
<div class="form-card" style="max-width:520px;">
    <h4><i class="bi bi-exclamation-triangle text-danger"></i> Delete Supplier</h4>
    <p>Are you sure you want to delete <strong>{{ object.company_name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'supplier_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
