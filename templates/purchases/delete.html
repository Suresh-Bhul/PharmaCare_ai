{% extends "base.html" %}
{% block title %}Delete Purchase{% endblock %}
{% block content %}
<div class="form-card" style="max-width:520px;">
    <h4><i class="bi bi-exclamation-triangle text-danger"></i> Delete Purchase</h4>
    <p>Are you sure you want to delete purchase <strong>{{ object.purchase_number }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'purchase_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
