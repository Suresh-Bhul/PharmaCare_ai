<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khalti Payment Result</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: #f4f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal {
        width: 100%;
        max-width: 430px;
        background: #fff;
        border-radius: 20px;
        padding: 35px 30px 30px;
        text-align: center;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
        animation: modalIn 0.3s ease;
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(20px);
        }

        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .status-icon {
        width: 82px;
        height: 82px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 45px;
        font-weight: bold;
      }

      .success-icon {
        background: #dcfce7;
        color: #16a34a;
      }

      .failed-icon {
        background: #fee2e2;
        color: #dc2626;
      }

      .modal h1 {
        font-size: 26px;
        color: #222;
        margin-bottom: 10px;
      }

      .modal-message {
        color: #777;
        font-size: 15px;
        line-height: 1.5;
        margin-bottom: 25px;
      }

      .details {
        background: #f8f8fa;
        border-radius: 14px;
        padding: 15px 18px;
        margin-bottom: 25px;
        text-align: left;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
        padding: 11px 0;
        border-bottom: 1px solid #e8e8e8;
      }

      .detail-row:last-child {
        border-bottom: none;
      }

      .detail-label {
        color: #777;
        font-size: 14px;
      }

      .detail-value {
        color: #222;
        font-size: 14px;
        font-weight: 600;
        text-align: right;
        max-width: 220px;
        overflow-wrap: anywhere;
      }

      .amount {
        color: #5b2a91;
        font-size: 17px;
      }

      .continue-btn,
      .retry-btn {
        width: 100%;
        border: none;
        border-radius: 11px;
        padding: 14px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
      }

      .continue-btn {
        background: #5b2a91;
      }

      .continue-btn:hover {
        background: #482078;
      }

      .retry-btn {
        background: #dc2626;
        margin-bottom: 10px;
      }

      .retry-btn:hover {
        background: #b91c1c;
      }

      .status-badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }

      .badge-success {
        color: #15803d;
        background: #dcfce7;
      }

      .badge-failed {
        color: #b91c1c;
        background: #fee2e2;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="modal-overlay" id="paymentModal">
      <div class="modal">
        <!-- ==================== SUCCESS ==================== -->
        <div id="successContent" class="hidden">
          <div class="status-icon success-icon">✓</div>

          <h1>Payment Completed</h1>

          <p class="modal-message">
            Your Khalti payment was completed successfully.
          </p>

          <div class="details">
            <div class="detail-row">
              <span class="detail-label">Status</span>

              <span class="detail-value">
                <span class="status-badge badge-success"> Completed </span>
              </span>
            </div>

            <div class="detail-row">
              <span class="detail-label">Amount</span>

              <span class="detail-value amount" id="successAmount">
                Rs. 0.00
              </span>
            </div>

            <div class="detail-row">
              <span class="detail-label">Transaction ID</span>

              <span class="detail-value" id="successTransactionId"> - </span>
            </div>

            <div class="detail-row">
              <span class="detail-label">Order ID</span>

              <span class="detail-value" id="successOrderId"> - </span>
            </div>
          </div>

          <!-- IMPORTANT: successContent closes here -->
          <button class="continue-btn" onclick="continuePayment()">
            Done!
          </button>
        </div>

        <!-- ==================== FAILED ==================== -->
        <div id="failedContent" class="hidden">
          <div class="status-icon failed-icon">×</div>

          <h1>Payment Failed</h1>

          <p class="modal-message">
            Your Khalti payment could not be completed. Please try again.
          </p>

          <div class="details">
            <div class="detail-row">
              <span class="detail-label">Status</span>

              <span class="detail-value">
                <span class="status-badge badge-failed" id="failedStatus">
                  Failed
                </span>
              </span>
            </div>

            <div class="detail-row">
              <span class="detail-label">Amount</span>

              <span class="detail-value amount" id="failedAmount">
                Rs. 0.00
              </span>
            </div>

            <div class="detail-row">
              <span class="detail-label">Transaction ID</span>

              <span class="detail-value" id="failedTransactionId"> - </span>
            </div>

            <div class="detail-row">
              <span class="detail-label">Order ID</span>

              <span class="detail-value" id="failedOrderId"> - </span>
            </div>
          </div>

          <button class="retry-btn" onclick="retryPayment()">Try Again</button>

          <button class="continue-btn" onclick="continuePayment()">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script>
      // ==========================================
      // READ KHALTI CALLBACK PARAMETERS
      // ==========================================

      const params = new URLSearchParams(window.location.search);

      const payment = {
        pidx: params.get("pidx") || "",

        transaction_id: params.get("transaction_id") || "",

        tidx: params.get("tidx") || "",

        txnId: params.get("txnId") || "",

        amount: params.get("amount") || "0",

        total_amount: params.get("total_amount") || "0",

        mobile: params.get("mobile") || "",

        status: params.get("status") || "",

        purchase_order_id: params.get("purchase_order_id") || "",

        purchase_order_name: params.get("purchase_order_name") || "",
      };

      // ==========================================
      // FORMAT PAISA → RUPEES
      // ==========================================

      function formatAmount(amount) {
        const paisa = Number(amount);

        if (isNaN(paisa)) {
          return "Rs. 0.00";
        }

        const rupees = paisa / 100;

        return (
          "Rs. " +
          rupees.toLocaleString("en-NP", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      }

      // ==========================================
      // SHOW PAYMENT RESULT
      // ==========================================

      function showPaymentResult() {
        const successContent = document.getElementById("successContent");

        const failedContent = document.getElementById("failedContent");

        // Only Completed = successful
        const isCompleted = payment.status.trim().toLowerCase() === "completed";

        console.log("Khalti payment:", payment);
        console.log("Status:", payment.status);
        console.log("Completed:", isCompleted);

        if (isCompleted) {
          // ==============================
          // SUCCESS
          // ==============================

          successContent.classList.remove("hidden");

          failedContent.classList.add("hidden");

          document.getElementById("successAmount").textContent = formatAmount(
            payment.total_amount || payment.amount,
          );

          document.getElementById("successTransactionId").textContent =
            payment.transaction_id || payment.tidx || payment.txnId || "-";

          document.getElementById("successOrderId").textContent =
            payment.purchase_order_id || "-";
        } else {
          // ==============================
          // FAILED
          // ==============================

          successContent.classList.add("hidden");

          failedContent.classList.remove("hidden");

          document.getElementById("failedAmount").textContent = formatAmount(
            payment.total_amount || payment.amount,
          );

          document.getElementById("failedTransactionId").textContent =
            payment.transaction_id || payment.tidx || payment.txnId || "-";

          document.getElementById("failedOrderId").textContent =
            payment.purchase_order_id || "-";

          document.getElementById("failedStatus").textContent =
            payment.status || "Failed";
        }
      }

      //Continue/close
      function continuePayment() {
        window.location.href = "/";
      }

      // RETRY PAYMENT      
      function retryPayment() {
        window.location.href = "/payment/";
      }
      
      // START
      showPaymentResult();
    </script>
  </body>
</html>
